# srsRAN Project gNB template for later USRP-based tests.
# Adjust device_args, gains, clocking, ARFCN, band, and bandwidth for the
# actual RF setup before transmitting.

cu_cp:
  amf:
    addr: 10.0.0.197
    port: 38412
    bind_addr: 10.0.0.197
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "20893"
            tai_slice_support_list:
              - sst: 1
                sd: "010203"

  inactivity_timer: 7200

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "20893"
  tac: 1
  pci: 1

ru_sdr:
  device_driver: uhd
  device_args: type=b200
  srate: 23.04
  tx_gain: 70
  rx_gain: 40

log:
  filename: /tmp/srsran_gnb_usrp.log
  all_level: info

pcap:
  mac_enable: false
  ngap_enable: true
  ngap_filename: /tmp/srsran_gnb_usrp_ngap.pcap
